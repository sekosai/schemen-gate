name: Credential broker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/credential-broker/**"
      - ".github/workflows/credential-broker.yml"
      - "src/schemen_gate/**"
      - "pyproject.toml"
      - "scripts/stamp_release.py"
      - "LICENSE"
  pull_request:
    paths:
      - "services/credential-broker/**"
      - ".github/workflows/credential-broker.yml"
      - "src/schemen_gate/**"
      - "pyproject.toml"
      - "scripts/stamp_release.py"
      - "LICENSE"

permissions:
  contents: read

jobs:
  broker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    defaults:
      run:
        working-directory: services/credential-broker
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install hash-locked service dependencies
        run: python -m pip install -r requirements.lock
      - name: Install build and analysis tools
        run: >-
          python -m pip install "setuptools==84.0.0" "wheel==0.47.0" "build==1.6.0" "ruff>=0.12" "mypy>=1.19,<2"
      - name: Install optional Gate from this commit
        run: |
          python -m pip install -r requirements-gate.lock
          python -m pip install -r requirements-delegation.lock
          python ../../scripts/stamp_release.py --version 1.0.3 --repository https://github.com/sekosai/schemen-gate --commit "${GITHUB_SHA}"
          python -m pip install --no-deps --no-build-isolation ../..
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m pip check
      - name: Adversarial HTTP, TLS, custody and CLI tests
        run: python -m pytest -q --junitxml=broker-tests.xml
      - name: Signed delegation and standards composition tests
        run: |
          python -m pip install -r proofs/oauth-delegation/requirements.lock
          cd proofs/oauth-delegation
          python -m pytest -q --junitxml=delegation-tests.xml
          python -m ruff check oauth_proof tests
          python -m ruff format --check oauth_proof tests
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m mypy src/credential_broker
      - run: python -m build --no-isolation
      - run: python scripts/verify_wheel.py
      - name: Installed package and CLI smoke test
        run: |
          python -I -c "import credential_broker, sys; assert 'schemen_gate' not in sys.modules"
          schemen-broker --help
          python -I -m credential_broker.delegation.demo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: credential-broker-tests-${{ matrix.python-version }}-${{ github.sha }}
          path: |
            services/credential-broker/broker-tests.xml
            services/credential-broker/proofs/oauth-delegation/delegation-tests.xml
          if-no-files-found: error
