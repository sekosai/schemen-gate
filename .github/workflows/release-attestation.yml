name: Release Attestation

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  attest:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'v1.0.2' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.repository.id == github.event.repository.id &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.sha == github.event.workflow_run.head_sha &&
      github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    environment: public-release
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download the immutable verified build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: schemen-gate-dist-${{ github.event.workflow_run.head_sha }}
          path: dist
          digest-mismatch: error
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Attest the trusted admission workflow provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/schemen_gate-1.0.2-py3-none-any.whl
            dist/schemen_gate-1.0.2.tar.gz
      - name: Attest the approved v1.0.2 release identity
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/schemen_gate-1.0.2-py3-none-any.whl
            dist/schemen_gate-1.0.2.tar.gz
          predicate-type: https://github.com/sekosai/schemen-gate/attestations/release/v1
          predicate: |
            {
              "schema": "schemen/gate-release-attestation-v1",
              "package": "schemen-gate",
              "version": "1.0.2",
              "source_repository": "https://github.com/sekosai/schemen-gate",
              "source_repository_id": "${{ github.event.workflow_run.head_repository.id }}",
              "source_ref": "refs/tags/v1.0.2",
              "source_commit": "${{ github.event.workflow_run.head_sha }}",
              "ci_workflow": ".github/workflows/ci.yml",
              "ci_workflow_id": "${{ github.event.workflow_run.workflow_id }}",
              "ci_run_id": "${{ github.event.workflow_run.id }}",
              "ci_run_attempt": "${{ github.event.workflow_run.run_attempt }}",
              "artifact_name": "schemen-gate-dist-${{ github.event.workflow_run.head_sha }}"
            }
