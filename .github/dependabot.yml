version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /services/credential-broker
    schedule:
      interval: weekly
    groups:
      broker-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /services/credential-broker/proofs/oauth-delegation
    schedule:
      interval: weekly
    groups:
      delegation-proof-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /research/cdp/experiments
    schedule:
      interval: weekly
    groups:
      research-dependencies:
        patterns:
          - "*"
