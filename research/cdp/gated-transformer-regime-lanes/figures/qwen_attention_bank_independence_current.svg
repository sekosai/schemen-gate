<text x="55" y="543" class="gap-title" text-anchor="start">NEXT FALSIFIER: make trajectories distinct early, then traverse the shared backbone</text>
<text x="55" y="574" class="gap-text" text-anchor="start">Current SFT divergence enters at decoder layer 23; exact concurrency is real but shallow after divergence.</text>
<text x="55" y="602" class="gap-text" text-anchor="start">Next: graft or train at layer 4, capture attention-write / post-residual / FFN-write / post-residual at every downstream layer.</text>
<text x="55" y="630" class="gap-text" text-anchor="start">Require exact seq↔concurrent parity, zero off-regime finite sensitivity, disjoint state, and detector-positive glue/no-Gate controls.</text>
