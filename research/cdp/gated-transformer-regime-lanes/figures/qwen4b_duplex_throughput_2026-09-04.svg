<text class="value" x="643.4" y="348">14.98 GiB</text>
<text class="head" x="830" y="150">B. Peak allocated GPU memory</text>
<text class="label" x="830" y="218">ordinary shared</text>
<rect x="1000" y="198" width="218.5" height="28" rx="5" fill="#8da9c4"/>
<text class="value" x="1228.5" y="218">9.88 GiB</text>
<text class="label" x="830" y="283">R=2 attention bank</text>
<rect x="1000" y="263" width="267.1" height="28" rx="5" fill="#32d296"/>
<text class="value" x="1277.1" y="283">12.08 GiB</text>
<text class="label" x="830" y="348">two full models</text>
<rect x="1000" y="328" width="391.0" height="28" rx="5" fill="#f2a65a"/>
<text class="value" x="1401.0" y="348">17.69 GiB</text>
<text class="small" x="70" y="392">R=2 composite is base + actual reopened delta; it is not a serialized monolith.</text>
<text class="small" x="830" y="392">Peak reserved bytes are retained separately; allocated bytes are shown.</text>
