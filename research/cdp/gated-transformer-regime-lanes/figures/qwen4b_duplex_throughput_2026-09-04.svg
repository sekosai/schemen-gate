<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Qwen3-4B duplex correctness, footprint, and throughput</title>
<desc id="desc">Four panels report artifact footprint, peak allocated GPU memory, concurrent over serial speedup, and exact duplex correctness.</desc>
<rect width="1600" height="1000" fill="#07131f"/>
<style>text{font-family:Inter,system-ui,sans-serif;fill:#edf5ff}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.label{font-size:17px}.small{font-size:14px;fill:#b9c8d8}.value{font-size:16px;font-weight:700}.axis{stroke:#668099;stroke-width:1}.grid{stroke:#284158;stroke-width:1}.pass{fill:#32d296}.warn{fill:#f2a65a}</style>
<text class="title" x="70" y="60">Qwen3-4B: duplex separation is exact; eager concurrency is adverse</text>
<text class="small" x="70" y="90">Pinned Qwen3-4B-Instruct-2507 · A100-80GB · BF16 eager · seven paired repetitions · 2026-09-04</text>
<text class="head" x="70" y="150">A. Deployable weight footprint</text>
<text class="label" x="70" y="218">ordinary shared</text>
