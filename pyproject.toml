[build-system]
requires = ["setuptools==84.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "schemen-gate"
version = "1.0.2"
description = "AI PKI primitives for identity-bound Gates, lockboxes, capabilities, and Cargo."
readme = {file = "PYPI.md", content-type = "text/markdown"}
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{name = "Sekos AI"}]
keywords = [
    "ai-pki",
    "provenance",
    "inference",
    "gate",
    "mask",
    "cryptographic",
    "capability",
    "lockbox",
    "cargo",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
crypto = ["cryptography>=50.0"]
torch = ["torch>=2.13"]
lockbox = ["cryptography>=50.0", "pyyaml>=6.0"]
onnx = ["onnx>=1.14"]
spiffe = ["spiffe>=0.3.0"]
rag = ["psycopg[binary]>=3.1", "scikit-learn>=1.3"]
dev = [
    "mypy>=1.19,<2",
    "pypdf>=6.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.12",
    "twine==7.0.0",
    "types-PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/sekosai/schemen-gate"
Issues = "https://github.com/sekosai/schemen-gate/issues"
Changelog = "https://github.com/sekosai/schemen-gate/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F", "I", "B"]

[tool.mypy]
strict = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
